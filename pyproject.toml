[project]
name = "nautobot-agent"
version = "1.0.1"
description = "AI agent integration for Nautobot."
authors = [{ name = "Geury Torres", email = "geuryt@yahoo.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
keywords = ["nautobot", "nautobot-app", "nautobot-plugin"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "nautobot>=3.0.0,<4.0.0",
    "markdown-it-py>=4.2.0,<5",
    "langchain>=1.4.9,<2",
    "langchain-core>=1.7.6,<2",
    # Imported directly by nautobot_agent.mcp (Client, ClientGroup, transports, elicitation, tool types).
    "fastmcp>=4.1,<5",
    "mcp>=2.3,<3",
    # Pin the qualified filesystem permissions, tool-repair, and model-refusal behavior.
    "deepagents==0.7.39",
    # Exact pin: the app-owned interpreter driver is qualified against pydantic-monty 1.5.0's session,
    # snapshot, OS-policy, and resource-limit (max_feed_duration_secs/max_memory) contract.
    "pydantic-monty==1.5.0",
    "langchain-openai==1.7.4",
    "langchain-anthropic==1.7.10",
    "langchain-google-genai==4.4.3",
    "langchain-ollama==1.1.0",
    "langchain-openrouter==0.2.9",
    "langchain-deepseek==1.1.1",
    # The checkpoint saver depends on private imports and beta delta replay contracts.
    "langgraph==1.2.12",
    "langgraph-checkpoint==4.2.0",
]

[project.urls]
Homepage = "https://github.com/gt732/nautobot-app-agent"
Repository = "https://github.com/gt732/nautobot-app-agent"

[project.optional-dependencies]
dev = [
    "coverage",
    # Official checkpointer conformance suite; the dev extra runs it through ordinary Django tests.
    "langgraph-checkpoint-conformance==0.0.2",
    "invoke",
    "pylint>=4.1.1,<5",
    "pylint-django>=2.8.0,<3",
    "pylint-nautobot>=1.1.0,<2",
    # Cognitive-complexity checker (too-cognitively-complex); requires pylint>=4.1.1.
    "pylint-cognitive-complexity==0.1.1",
    "ruff==0.17.3",
    "ty==0.0.94",
    # Python implementation of markdownlint
    "pymarkdownlnt~=0.9.30",
    "djlint>=1.36.4,<2.0.0",
]

[tool.poetry]
packages = [
    { include = "nautobot_agent" },
]
include = [
    { path = "nautobot_agent/static/nautobot_agent/docs/**/*", format = ["sdist", "wheel"] },
    { path = "nautobot_agent/tools/monty/LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "1.6.0"
mkdocs-material = "9.5.32"
mkdocstrings = "0.25.2"
mkdocstrings-python = "1.10.8"
mkdocs-autorefs = "1.2.0"
griffe = "1.1.1"
mkdocs-glightbox = "~0.5.2"


[tool.pylint.main]
# Include the pylint_django plugin to avoid spurious warnings about Django patterns
# pylint_cognitive_complexity adds too-cognitively-complex, the single blocking complexity gate;
# branches/arguments/statements limits are enforced by Ruff; the remaining size limits stay at Pylint defaults.
load-plugins = "pylint_django, pylint_nautobot, pylint_cognitive_complexity"
ignore = ".venv,.dev"

[tool.pylint.basic]
# No docstrings required for private methods (Pylint default), or for test_ functions, or for inner Meta classes.
no-docstring-rgx = "^(_|test_|Meta$)"

[tool.pylint.cognitive-complexity]
# Outlier alarm, not a style target: do not split code into helpers solely to satisfy it.
max-cognitive-complexity = 15

[tool.pylint.messages_control]
# Pylint owns cognitive complexity, inference (no-member, call arguments), cross-module
# checks (cyclic-import, duplicate-code), Django/Nautobot plugin checks, and checks
# without a stable Ruff equivalent (nested blocks, locals, boolean expressions,
# return statements, instance attributes, used-before-assignment).
# Messages below are owned by Ruff rules selected in [tool.ruff.lint], per Ruff's
# Pylint parity tracker (astral-sh/ruff#970); detection details may differ:
#   F    -> undefined/redefined names, unused imports/variables, format strings, literal-comparison
#   E/W  -> bare-except, imports position, statements, trailing whitespace, backslash escapes
#   B    -> defaults, loop closures, duplicate except/value, lost-exception, raise-missing-from
#   D/I  -> docstrings, import order/grouping;  S -> eval/exec;  A -> redefined-builtin
#   S113 -> missing-timeout;  UP031/UP032 -> consider-using-f-string;  PIE790 -> unnecessary-ellipsis
#   SIM/RET/C4/UP/PIE/BLE -> simplifications, negations, else-after-return, comprehensions, modern syntax
#   PL*  -> design limits (branches/arguments/statements), constant and string-literal
#           asserts, invalid characters
# Line endings and trailing newlines are normalized by `ruff format`. positional-arguments and line length are not enforced.
disable = """,
    line-too-long,
    too-many-positional-arguments,
    unused-import,
    wildcard-import,
    unused-wildcard-import,
    redefined-builtin,
    unused-variable,
    singleton-comparison,
    trailing-whitespace,
    missing-final-newline,
    invalid-character-backspace,
    invalid-character-esc,
    invalid-character-nul,
    invalid-character-sub,
    invalid-character-zero-width-space,
    mixed-line-endings,
    unexpected-line-ending-format,
    assert-on-string-literal,
    assert-on-tuple,
    comparison-of-constants,
    return-outside-function,
    broad-exception-caught,
    function-redefined,
    undefined-variable,
    format-needs-mapping,
    missing-format-string-key,
    mixed-format-string,
    nonexistent-operator,
    not-in-loop,
    notimplemented-raised,
    too-few-format-args,
    too-many-format-args,
    too-many-star-expressions,
    truncated-format-string,
    undefined-all-variable,
    yield-outside-function,
    anomalous-backslash-in-string,
    bad-format-string,
    bare-except,
    cell-var-from-loop,
    dangerous-default-value,
    duplicate-except,
    duplicate-key,
    duplicate-value,
    eval-used,
    exec-used,
    expression-not-assigned,
    f-string-without-interpolation,
    format-combined-specification,
    format-string-without-interpolation,
    keyword-arg-before-vararg,
    lost-exception,
    method-cache-max-size-none,
    misplaced-future,
    missing-format-argument-key,
    pointless-statement,
    raise-missing-from,
    redundant-u-string-prefix,
    reimported,
    unnecessary-pass,
    unnecessary-semicolon,
    unused-format-string-argument,
    unused-format-string-key,
    consider-iterating-dictionary,
    empty-docstring,
    missing-class-docstring,
    missing-function-docstring,
    missing-module-docstring,
    multiple-imports,
    multiple-statements,
    trailing-newlines,
    ungrouped-imports,
    unidiomatic-typecheck,
    unnecessary-lambda-assignment,
    wrong-import-order,
    wrong-import-position,
    consider-merging-isinstance,
    consider-using-dict-comprehension,
    consider-using-generator,
    consider-using-get,
    consider-using-set-comprehension,
    consider-using-with,
    inconsistent-return-statements,
    literal-comparison,
    no-else-break,
    no-else-continue,
    no-else-raise,
    no-else-return,
    simplifiable-if-expression,
    simplifiable-if-statement,
    super-with-arguments,
    unnecessary-comprehension,
    use-a-generator,
    use-list-literal,
    use-dict-literal,
    use-yield-from,
    useless-object-inheritance,
    too-many-branches,
    too-many-arguments,
    too-many-statements,
    consider-using-f-string,
    missing-timeout,
    unnecessary-ellipsis,
    unnecessary-negation,
"""

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".dev"]

[tool.ruff.lint]
select = [
    "D",  # pydocstyle
    "F", "E", "W",  # flake8
    "S",  # bandit
    "I",  # isort
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
    "RUF",  # ruff-specific rules
    "A",  # builtin shadowing (Pylint's redefined-builtin is disabled in favor of this)
    "ASYNC",  # blocking calls and misuse inside async code (MCP/agent runtime)
    "DTZ",  # naive datetimes under Django USE_TZ
    "PGH004",  # blanket `# noqa` that hides unrelated findings
    "PIE",  # unnecessary statements, duplicate class fields/enum values
    "PLW2901",  # loop variable overwritten inside the loop body
    "SIM",  # simplifiable conditionals and context managers
    "RET",  # redundant else/return/assignment before return
    "C4",  # unnecessary comprehensions and collection calls
    "ERA",  # commented-out code
    "FURB",  # verbose idioms with simpler modern equivalents
    "PERF",  # avoidable loop/collection overhead
    "BLE",  # blind `except Exception`; boundary catches need a justified noqa
    # Stable Pylint rules owned by Ruff (matching Pylint messages are disabled there).
    "PLR0912",  # too many branches (Ruff does not count `try` as a branch)
    "PLR0913",  # too many arguments
    "PLR0915",  # too many statements
    "PLW0129",  # assert on string literal
    "PLR0133",  # comparison of constants
    "PLE2510", "PLE2512", "PLE2513", "PLE2514", "PLE2515",  # invalid control/zero-width characters
]
ignore = [
    "D212", # Multi-line docstring summaries may start on the line after the opening quotes.
    "E501", # Line too long
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"nautobot_agent/migrations/*" = [
    "D",
]
"nautobot_agent/tests/*" = [
    "D",
    "S",
    "PLR0913",  # test doubles mirror production signatures
    "PLR0915",  # scenario tests keep one end-to-end flow per method
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["nautobot_agent"]
exclude = ["nautobot_agent/migrations", ".dev"]

[tool.ty.rules]
blanket-ignore-comment = "error"
invalid-ignore-comment = "error"
unused-ignore-comment = "warn"
# Un-awaited coroutines never run; always a bug.
unused-awaitable = "error"
# Names bound only on some branches (e.g. inside try/if) then used unconditionally.
possibly-unresolved-reference = "error"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.terminal]
error-on-warning = false

[tool.coverage.run]
disable_warnings = ["already-imported"]
relative_files = true
omit = [
    # Skip Tests
    "*/tests/*",
]
include = [
    "nautobot_agent/*",
]

[tool.pymarkdown]
plugins.selectively_enable_rules = true
plugins.blanks-around-lists.enabled = true
plugins.list-anchored-indent.enabled = true
extensions.front-matter.enabled = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.djlint]
ignore = "H015"
profile="django"
extend_exclude = ".agents/,docs/,nautobot_agent/static/,.dev/"
