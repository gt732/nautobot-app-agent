name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  tests:
    name: Docker checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare development configuration
        run: cp development/nautobot_config.example.py development/nautobot_config.py
      - name: Build development image
        run: docker compose build nautobot
      - name: Start test dependencies
        run: docker compose up -d --wait db redis
      - name: Run project checks
        run: |
          docker compose run --rm --no-deps --entrypoint sh nautobot -ec '
            invoke lock --check
            invoke tests --no-input
            invoke build-and-check-docs
          '
      - name: Show dependency logs on failure
        if: failure()
        run: docker compose logs --no-color db redis
      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
