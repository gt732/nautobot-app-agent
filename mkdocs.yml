---
dev_addr: "127.0.0.1:8001"
site_name: "Nautobot Agent Documentation"
site_description: "Installation, configuration, and usage of Nautobot Agent."
site_url: "https://gt732.github.io/nautobot-app-agent/"
site_dir: "nautobot_agent/static/nautobot_agent/docs"
repo_url: "https://github.com/gt732/nautobot-app-agent"
edit_uri: "edit/main/docs/"
copyright: "Copyright &copy; The Authors"
theme:
  name: "material"
  custom_dir: "docs/assets/overrides"
  favicon: "assets/favicon.ico"
  logo: "assets/nautobot_logo.svg"
  features:
    - "content.action.edit"
    - "content.action.view"
    - "content.code.copy"
    - "navigation.footer"
    - "navigation.indexes"
    - "navigation.tabs"
    - "navigation.tabs.sticky"
    - "navigation.tracking"
    - "search.highlight"
    - "search.share"
    - "search.suggest"
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: "default"
      primary: "black"
      toggle:
        icon: "material/weather-sunny"
        name: "Switch to dark mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: "slate"
      primary: "black"
      toggle:
        icon: "material/weather-night"
        name: "Switch to light mode"
extra_css:
  - "assets/extra.css"
extra:
  generator: false
  social:
    - icon: "fontawesome/solid/rss"
      link: "https://blog.networktocode.com/blog/tags/nautobot"
      name: "Network to Code Blog"
    - icon: "fontawesome/brands/youtube"
      link: "https://www.youtube.com/playlist?list=PLjA0bhxgryJ2Ts4GJMDA-tPzVWEncv4pb"
      name: "Nautobot Videos"
    - icon: "fontawesome/brands/slack"
      link: "https://www.networktocode.com/community/"
      name: "Network to Code Community"
    - icon: "fontawesome/brands/github"
      link: "https://github.com/nautobot/nautobot"
      name: "Nautobot GitHub Repository"
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - footnotes
plugins:
  - search
  - glightbox
  - mkdocstrings:
      default_handler: "python"
      handlers:
        python:
          paths: ["."]
          options:
            allow_inspection: false
            show_root_heading: true
watch:
  - "nautobot_agent"
validation:
  omitted_files: "warn"
  absolute_links: "warn"
  unrecognized_links: "warn"
  anchors: "warn"
nav:
  - Overview: "index.md"
  - User Guide:
      - Overview: "user/app_overview.md"
      - Getting Started: "user/getting_started.md"
      - Conversations: "user/conversations.md"
      - Charts and diagrams: "user/charts_and_diagrams.md"
      - Privacy and Data Handling: "user/privacy.md"
      - External interactions: "user/external_interactions.md"
      - FAQ: "user/faq.md"
  - Administrator Guide:
      - Installation: "admin/install.md"
      - Configuration: "admin/configuration.md"
      - Permissions and source access: "admin/permissions.md"
      - Integrations: "admin/integrations.md"
      - Operations: "admin/operations.md"
      - Compatibility: "admin/compatibility.md"
      - Upgrade: "admin/upgrade.md"
      - Removal: "admin/uninstall.md"
  - Developer Guide:
      - Docker Development: "dev/docker.md"
      - Documentation: "dev/documentation.md"
      - Code Reference: "dev/code_reference.md"
  - Nautobot Docs Home ↗︎: "https://docs.nautobot.com/"
